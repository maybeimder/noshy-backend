# Server / homelab:  docker compose up -d --build   (o: sudo web-deploy <dominio>, puerto 3000)
# Desarrollo local:  pnpm infra:up                  -> solo Postgres + RabbitMQ (la API con pnpm dev)
#
# Todo escucha en 127.0.0.1 del host: lo publica Nginx (web-deploy). Para exponer la API directo
# a la red local sin Nginx, define API_BIND=0.0.0.0 en .env.
# La API y el worker corren en modo dev (tsx watch) con ./src montado: `git pull` y se recargan solos.
#
# `api` debe ser el PRIMER servicio: web-deploy genera su override de puertos para el primer servicio.

services:
  api:
    build: .
    image: noshy-backend-dev
    container_name: noshy-api
    restart: unless-stopped
    command: ["node_modules/.bin/tsx", "watch", "src/entrypoints/api.ts"]
    ports:
      - "${API_BIND:-127.0.0.1}:${API_PORT:-3000}:3000"
    volumes:
      - ./src:/app/src:ro
    extra_hosts:
      # Para alcanzar servicios del propio server (ej. MongoDB del catálogo) desde el contenedor.
      - "host.docker.internal:host-gateway"
    env_file:
      - path: .env
        required: false
    environment:
      # Dentro de la red de Docker los servicios se llaman por su nombre (postgres, rabbitmq).
      PORT: "3000"
      DATABASE_URL: postgres://noshy:${POSTGRES_PASSWORD:-noshy}@postgres:5432/noshy
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-noshy}:${RABBITMQ_PASSWORD:-noshy}@rabbitmq:5672
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  worker:
    build: . # misma imagen que la API (sale de la caché); evita que compose intente descargarla
    image: noshy-backend-dev
    container_name: noshy-worker
    restart: unless-stopped
    command: ["node_modules/.bin/tsx", "watch", "src/entrypoints/worker.ts"]
    volumes:
      - ./src:/app/src:ro
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://noshy:${POSTGRES_PASSWORD:-noshy}@postgres:5432/noshy
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-noshy}:${RABBITMQ_PASSWORD:-noshy}@rabbitmq:5672
    depends_on:
      api:
        condition: service_healthy # la API crea la topología de RabbitMQ y aplica las migraciones

  postgres:
    image: postgres:17-alpine
    container_name: noshy-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5433:5432" # 5433 en el host: evita chocar con un PostgreSQL local en 5432
    environment:
      POSTGRES_DB: noshy
      POSTGRES_USER: noshy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-noshy}
    volumes:
      - noshy-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U noshy -d noshy"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    container_name: noshy-rabbitmq
    restart: unless-stopped
    ports:
      - "127.0.0.1:5672:5672"   # AMQP
      - "127.0.0.1:15672:15672" # panel web, solo desde el propio equipo: http://localhost:15672
    environment:
      # No se usa "guest": RabbitMQ solo lo deja conectar desde localhost y la API corre en otro contenedor.
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-noshy}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-noshy}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  noshy-postgres-data:
