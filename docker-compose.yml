services:
  rabbitmq:
    image: rabbitmq:4-management
    container_name: noshy-rabbitmq
    ports:
      - "5672:5672"   # AMQP (la app)
      - "15672:15672" # panel web: http://localhost:15672 (guest / guest)
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:17-alpine
    container_name: noshy-postgres
    ports:
      - "5433:5432" # 5433 en el host: evita chocar con un PostgreSQL local en 5432
    environment:
      POSTGRES_DB: noshy
      POSTGRES_USER: noshy
      POSTGRES_PASSWORD: noshy
    volumes:
      - noshy-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U noshy -d noshy"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  noshy-postgres-data:
