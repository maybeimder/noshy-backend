services:
  rabbitmq:
    image: rabbitmq:4-management
    container_name: noshy-rabbitmq
    ports:
      - "5672:5672"   # AMQP (la app)
      - "15672:15672" # panel web: http://localhost:15672 (guest / guest)
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
